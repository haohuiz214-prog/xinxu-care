<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2538">
  <meta name="description" content="记录情绪，理解触发因素，找到此刻可执行的自我关怀方式。">
  <title>心绪 · 情绪日记与自我关怀</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d2538'/%3E%3Cpath d='M19 34c8-1 9-14 18-13 7 1 10 9 7 15-4 8-15 12-25 5' fill='none' stroke='%23ffb15a' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='34' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root { --ink:#102a43; --muted:#637789; --paper:#f4f7f8; --card:#fff; --line:#dce5e9; --navy:#0d2538; --blue:#1f657e; --orange:#f39a45; --orange2:#ffb15a; --soft:#eef5f6; --danger:#a73d47; --shadow:0 18px 50px rgba(21,53,70,.09); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-size:16px; line-height:1.55; }
    button,input,textarea { font:inherit; }
    button { color:inherit; }
    .shell { max-width:1180px; margin:auto; padding:28px 28px 64px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:.02em; }
    .brand-mark { width:42px; height:42px; border-radius:13px; background:var(--navy); display:grid; place-items:center; box-shadow:0 8px 24px rgba(13,37,56,.18); }
    .brand-mark svg { width:27px; }
    .privacy { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:.86rem; }
    .privacy svg { width:17px; }
    .intro { margin:0 0 24px; }
    .eyebrow { margin:0 0 5px; color:var(--blue); font-size:.83rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0; color:var(--navy); font-size:clamp(1.85rem,4vw,3rem); line-height:1.15; letter-spacing:-.035em; }
    .intro p:last-child { margin:10px 0 0; color:var(--muted); max-width:650px; }
    .grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:22px; align-items:start; }
    .card { background:var(--card); border:1px solid rgba(220,229,233,.9); border-radius:24px; box-shadow:var(--shadow); }
    .checkin { padding:28px; }
    .side { display:grid; gap:22px; }
    .side .card { padding:24px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:16px; }
    h2 { margin:0; font-size:1.12rem; letter-spacing:-.015em; }
    .step { color:var(--muted); font-size:.82rem; }
    .moods { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:26px; }
    .mood { border:1px solid var(--line); background:#fff; border-radius:15px; padding:12px 5px 10px; display:grid; place-items:center; gap:5px; cursor:pointer; transition:.18s ease; min-width:0; }
    .mood:hover { border-color:#9ab5c0; transform:translateY(-1px); }
    .mood.active { background:var(--navy); color:#fff; border-color:var(--navy); transform:translateY(-2px); box-shadow:0 9px 18px rgba(13,37,56,.16); }
    .mood .face { font-size:1.6rem; line-height:1; }
    .mood .label { font-size:.78rem; white-space:nowrap; }
    .intensity-row { display:flex; align-items:center; gap:15px; margin:6px 0 27px; }
    input[type="range"] { flex:1; accent-color:var(--orange); }
    .score { min-width:44px; height:44px; border-radius:50%; background:#fff3e8; color:#a9550d; display:grid; place-items:center; font-weight:800; }
    label.field-label { display:block; margin-bottom:8px; font-weight:650; font-size:.92rem; }
    textarea { width:100%; min-height:105px; resize:vertical; border:1px solid var(--line); border-radius:16px; padding:14px 15px; color:var(--ink); background:#fbfcfc; outline:none; transition:.18s; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(31,101,126,.1); background:#fff; }
    .counter { text-align:right; color:var(--muted); font-size:.76rem; margin:5px 2px 15px; }
    .triggers { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px; }
    .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; cursor:pointer; font-size:.86rem; transition:.15s; }
    .chip.active { background:#e6f1f3; border-color:#8bb3bf; color:#174f63; font-weight:650; }
    .primary { width:100%; border:0; border-radius:15px; background:var(--orange); color:#2e1a08; font-weight:750; padding:14px 18px; cursor:pointer; box-shadow:0 9px 22px rgba(243,154,69,.24); transition:.18s; }
    .primary:hover { background:var(--orange2); transform:translateY(-1px); }
    .primary:focus-visible,.mood:focus-visible,.chip:focus-visible,.action-btn:focus-visible,.quiet-btn:focus-visible { outline:3px solid rgba(31,101,126,.3); outline-offset:2px; }
    .insight { display:none; overflow:hidden; position:relative; border-color:#bbd5db; background:linear-gradient(145deg,#f9fdfd,#edf6f7); }
    .insight.show { display:block; animation:rise .35s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } }
    .insight:before { content:""; position:absolute; width:120px; height:120px; border-radius:50%; background:rgba(243,154,69,.15); right:-50px; top:-60px; }
    .insight-icon { width:36px; height:36px; display:grid; place-items:center; background:var(--navy); color:white; border-radius:11px; margin-bottom:14px; }
    .insight p { margin:8px 0 17px; color:#405c69; }
    .action-btn { border:0; border-radius:12px; padding:11px 14px; background:var(--navy); color:#fff; font-weight:650; cursor:pointer; }
    .trend-card { min-height:260px; }
    .trend-head { display:flex; align-items:center; justify-content:space-between; }
    .quiet-btn { border:0; background:transparent; color:var(--blue); cursor:pointer; padding:5px; font-size:.82rem; }
    .empty { text-align:center; color:var(--muted); padding:43px 18px 25px; }
    .empty-dot { width:50px; height:50px; border-radius:50%; background:var(--soft); margin:0 auto 13px; display:grid; place-items:center; font-size:1.25rem; }
    .history-list { display:grid; gap:11px; margin-top:17px; }
    .history-item { display:grid; grid-template-columns:42px 1fr auto; gap:11px; align-items:center; padding:11px 0; border-top:1px solid #edf1f2; }
    .history-item:first-child { border-top:0; }
    .history-face { width:42px; height:42px; background:var(--soft); display:grid; place-items:center; border-radius:13px; font-size:1.3rem; }
    .history-main strong { display:block; font-size:.91rem; }
    .history-main span,.history-score { color:var(--muted); font-size:.76rem; }
    .mini-chart { height:95px; display:flex; align-items:end; gap:8px; margin:17px 0 7px; padding:0 4px; }
    .bar-wrap { flex:1; display:grid; justify-items:center; gap:5px; height:100%; align-content:end; }
    .bar { width:min(28px,72%); border-radius:7px 7px 3px 3px; background:linear-gradient(#ffbd79,var(--orange)); min-height:8px; transition:.3s; }
    .bar-label { font-size:.69rem; color:var(--muted); }
    .safety { margin-top:22px; padding:17px 20px; border-radius:18px; background:#eaf0f2; color:#526b77; font-size:.82rem; display:flex; gap:12px; align-items:flex-start; }
    .safety strong { color:var(--ink); }
    .crisis { display:none; margin:0 0 18px; padding:15px; border-radius:14px; background:#fff1f2; border:1px solid #e7bdc1; color:#7f2630; font-size:.88rem; }
    .crisis.show { display:block; }
    dialog { border:0; padding:0; border-radius:28px; max-width:min(440px,calc(100vw - 32px)); width:100%; box-shadow:0 30px 80px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(9,30,43,.68); backdrop-filter:blur(4px); }
    .breathe { padding:30px; text-align:center; background:#f8fbfb; }
    .breathe h2 { font-size:1.45rem; }
    .breathe p { color:var(--muted); margin:8px 0 24px; }
    .orb { width:150px; height:150px; margin:0 auto 22px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,#ffd09f,var(--orange)); color:#4b280b; font-weight:750; box-shadow:0 0 0 18px rgba(243,154,69,.12); transition:transform 4s ease-in-out; }
    .orb.expand { transform:scale(1.22); }
    .timer { font-variant-numeric:tabular-nums; font-size:1.15rem; margin-bottom:20px; }
    .dialog-actions { display:flex; justify-content:center; gap:10px; }
    .secondary { border:1px solid var(--line); background:white; border-radius:12px; padding:10px 16px; cursor:pointer; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--navy); color:#fff; padding:11px 17px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:10; box-shadow:0 12px 30px rgba(0,0,0,.2); }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:820px) { .shell{padding:20px 18px 46px}.grid{grid-template-columns:1fr}.intro{margin-top:30px}.side{grid-template-columns:1fr}.privacy span{display:none} }
    @media(max-width:540px) { .shell{padding:16px 14px 40px}header{margin-bottom:22px}.checkin,.side .card{padding:20px;border-radius:20px}.moods{grid-template-columns:repeat(3,1fr);gap:7px}.mood{padding:11px 4px}.grid,.side{gap:14px}.safety{margin-top:14px}h1{font-size:2rem}.intro p:last-child{font-size:.92rem} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M8 22c7-1 7-11 15-11 6 1 9 8 6 13-3 6-12 9-21 5" fill="none" stroke="#ffb15a" stroke-width="3.5" stroke-linecap="round"/><circle cx="8" cy="22" r="3" fill="white"/></svg></span><span>心绪</span></div>
      <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 10V8a6 6 0 0 1 12 0v2"/><rect x="4" y="10" width="16" height="11" rx="3"/></svg><span>记录仅保存在当前设备</span></div>
    </header>

    <section class="intro">
      <p class="eyebrow" id="today">今日 · 情绪签到</p>
      <h1>此刻，你感觉怎么样？</h1>
      <p>不急着把一切想明白。先用一分钟，听见此刻的自己。</p>
    </section>

    <div class="grid">
      <section class="card checkin" aria-labelledby="checkin-title">
        <div class="section-head"><h2 id="checkin-title">选择最接近的感受</h2><span class="step">01</span></div>
        <div class="moods" role="radiogroup" aria-label="当前情绪">
          <button class="mood" data-mood="开心" data-face="😊" type="button" role="radio" aria-checked="false"><span class="face">😊</span><span class="label">开心</span></button>
          <button class="mood" data-mood="平静" data-face="😌" type="button" role="radio" aria-checked="false"><span class="face">😌</span><span class="label">平静</span></button>
          <button class="mood" data-mood="焦虑" data-face="😟" type="button" role="radio" aria-checked="false"><span class="face">😟</span><span class="label">焦虑</span></button>
          <button class="mood" data-mood="低落" data-face="😔" type="button" role="radio" aria-checked="false"><span class="face">😔</span><span class="label">低落</span></button>
          <button class="mood" data-mood="愤怒" data-face="😠" type="button" role="radio" aria-checked="false"><span class="face">😠</span><span class="label">愤怒</span></button>
          <button class="mood" data-mood="疲惫" data-face="😮‍💨" type="button" role="radio" aria-checked="false"><span class="face">😮‍💨</span><span class="label">疲惫</span></button>
        </div>

        <label class="field-label" for="intensity">情绪有多强烈？</label>
        <div class="intensity-row"><span aria-hidden="true">轻微</span><input id="intensity" type="range" min="1" max="10" value="5" aria-describedby="score"><output class="score" id="score" for="intensity">5</output></div>

        <label class="field-label" for="note">发生了什么？ <span style="font-weight:400;color:var(--muted)">（可不填）</span></label>
        <textarea id="note" maxlength="200" placeholder="例如：明天要做汇报，担心自己准备得不够……"></textarea>
        <div class="counter"><span id="count">0</span>/200</div>

        <div class="section-head"><h2>可能和什么有关？</h2><span class="step">02 · 可多选</span></div>
        <div class="triggers" aria-label="情绪触发因素">
          <button class="chip" type="button" aria-pressed="false">学业</button><button class="chip" type="button" aria-pressed="false">工作</button><button class="chip" type="button" aria-pressed="false">人际</button><button class="chip" type="button" aria-pressed="false">家庭</button><button class="chip" type="button" aria-pressed="false">睡眠</button><button class="chip" type="button" aria-pressed="false">身体</button><button class="chip" type="button" aria-pressed="false">经济</button><button class="chip" type="button" aria-pressed="false">其他</button>
        </div>
        <div class="crisis" id="crisis" role="alert"><strong>你的安全比记录更重要。</strong><br>如果你正处于危险中，请立即联系身边可信任的人，并寻求当地紧急援助或专业支持。不要独自承担。</div>
        <button class="primary" id="save" type="button">保存记录并获得建议</button>
      </section>

      <aside class="side">
        <section class="card insight" id="insight" aria-live="polite">
          <div class="insight-icon" aria-hidden="true">✦</div>
          <h2 id="insight-title">先照顾好此刻的自己</h2>
          <p id="insight-copy"></p>
          <button class="action-btn" id="action" type="button">开始 1 分钟呼吸</button>
        </section>

        <section class="card trend-card" aria-labelledby="trend-title">
          <div class="trend-head"><h2 id="trend-title">最近的心绪</h2><button class="quiet-btn" id="clear" type="button" hidden>清除记录</button></div>
          <div id="history"></div>
        </section>
      </aside>
    </div>

    <div class="safety"><span aria-hidden="true">◌</span><div><strong>温柔提醒</strong><br>心绪用于日常情绪记录与自我关怀，不提供医疗诊断，也不能替代心理咨询或医疗服务。</div></div>
  </main>

  <dialog id="breath-dialog" aria-labelledby="breath-title">
    <div class="breathe"><h2 id="breath-title">和呼吸待一分钟</h2><p>让注意力回到身体，不需要做得完美。</p><div class="orb" id="orb">准备好</div><div class="timer" id="timer">01:00</div><div class="dialog-actions"><button class="action-btn" id="breath-start" type="button">开始</button><button class="secondary" id="breath-close" type="button">稍后再做</button></div></div>
  </dialog>
  <div class="toast" id="toast" role="status">已保存今天的心绪</div>

  <script>
    const moods = [...document.querySelectorAll('.mood')];
    const chips = [...document.querySelectorAll('.chip')];
    const intensity = document.querySelector('#intensity');
    const note = document.querySelector('#note');
    const saveBtn = document.querySelector('#save');
    const insight = document.querySelector('#insight');
    const historyEl = document.querySelector('#history');
    const clearBtn = document.querySelector('#clear');
    const dialog = document.querySelector('#breath-dialog');
    let selectedMood = '';
    let breathInterval;
    const moodFaces = {开心:'😊',平静:'😌',焦虑:'😟',低落:'😔',愤怒:'😠',疲惫:'😮‍💨'};
    const recommendations = {
      开心:['把这份好心情留久一点','写下此刻最值得感谢的一件小事。','记录一件好事'],
      平静:['让平静继续流动','试着闭眼一分钟，感受身体与椅子的接触。','开始 1 分钟呼吸'],
      焦虑:['先让身体慢下来','把注意力放回呼吸：吸气 4 秒，呼气 6 秒。','开始 1 分钟呼吸'],
      低落:['今天可以对自己轻一点','做一件只需要五分钟的小事，完成就已经很好。','开始轻量行动'],
      愤怒:['给情绪留一点空间','先离开刺激源，缓慢走动五分钟，再决定下一步。','去走动 5 分钟'],
      疲惫:['休息也是重要的行动','喝一杯水，伸展肩颈，然后允许自己暂停五分钟。','开始肩颈伸展']
    };

    const dateFmt = new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'});
    document.querySelector('#today').textContent = `${dateFmt.format(new Date())} · 情绪签到`;
    moods.forEach(btn => btn.addEventListener('click',()=>selectMood(btn.dataset.mood)));
    chips.forEach(btn => btn.addEventListener('click',()=>{btn.classList.toggle('active');btn.setAttribute('aria-pressed',String(btn.classList.contains('active')))}));
    intensity.addEventListener('input',()=>document.querySelector('#score').value=intensity.value);
    note.addEventListener('input',()=>{document.querySelector('#count').textContent=note.value.length;checkCrisis()});

    function selectMood(mood){
      selectedMood=mood;
      moods.forEach(btn=>{const active=btn.dataset.mood===mood;btn.classList.toggle('active',active);btn.setAttribute('aria-checked',String(active))});
    }
    function selectedTriggers(){return chips.filter(c=>c.classList.contains('active')).map(c=>c.textContent)}
    function checkCrisis(){
      const risky=/(自杀|不想活|伤害自己|结束生命|活不下去)/.test(note.value);
      document.querySelector('#crisis').classList.toggle('show',risky);
      return risky;
    }
    function getRecords(){try{return JSON.parse(localStorage.getItem('xinxu-records')||'[]')}catch{return []}}
    function persist(record){const records=getRecords();records.unshift(record);localStorage.setItem('xinxu-records',JSON.stringify(records.slice(0,30)))}
    function createRecord(data){
      if(!data.mood || !moodFaces[data.mood]) throw new Error('请选择一种情绪');
      const level=Number(data.intensity);
      if(!Number.isInteger(level)||level<1||level>10) throw new Error('强度应为 1 到 10');
      const record={id:Date.now(),mood:data.mood,face:moodFaces[data.mood],intensity:level,note:String(data.note||'').slice(0,200),triggers:Array.isArray(data.triggers)?data.triggers.slice(0,8):[],createdAt:new Date().toISOString()};
      persist(record);renderInsight(record);renderHistory();return record;
    }
    saveBtn.addEventListener('click',()=>{
      try{const record=createRecord({mood:selectedMood,intensity:Number(intensity.value),note:note.value,triggers:selectedTriggers()});showToast('已保存今天的心绪');if(checkCrisis())document.querySelector('#crisis').scrollIntoView({behavior:'smooth',block:'center'});return record}catch(err){showToast(err.message)}
    });
    function renderInsight(r){
      const rec=recommendations[r.mood];
      const factors=r.triggers.length?r.triggers.slice(0,2).join('和'):'今天发生的事情';
      const high=r.intensity>=7?'这份感受有些强烈，先别要求自己马上解决所有问题。':'谢谢你停下来留意自己的感受。';
      document.querySelector('#insight-title').textContent=rec[0];
      document.querySelector('#insight-copy').textContent=`你记录的是${r.intensity}分的${r.mood}，可能与${factors}有关。${high} ${rec[1]}`;
      document.querySelector('#action').textContent=rec[2];
      insight.classList.add('show');
    }
    function renderHistory(){
      const records=getRecords();clearBtn.hidden=!records.length;
      if(!records.length){historyEl.innerHTML='<div class="empty"><div class="empty-dot">○</div><div>完成第一次记录后<br>这里会出现你的情绪轨迹</div></div>';return}
      const recent=[...records].slice(0,7).reverse();
      const chart=`<div class="mini-chart" aria-label="最近情绪强度趋势">${recent.map(r=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(12,r.intensity*8)}%" title="${escapeHtml(r.mood)} ${r.intensity}分"></div><span class="bar-label">${new Date(r.createdAt).getDate()}日</span></div>`).join('')}</div>`;
      const list=records.slice(0,3).map(r=>`<div class="history-item"><div class="history-face">${r.face}</div><div class="history-main"><strong>${escapeHtml(r.mood)} · ${escapeHtml((r.triggers||[]).join('、')||'随手记录')}</strong><span>${formatTime(r.createdAt)}</span></div><div class="history-score">${r.intensity}/10</div></div>`).join('');
      historyEl.innerHTML=chart+`<div class="history-list">${list}</div>`;
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function formatTime(d){const date=new Date(d);return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(date)}
    function showToast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    clearBtn.addEventListener('click',()=>{if(confirm('确定清除当前设备上的全部记录吗？')){localStorage.removeItem('xinxu-records');insight.classList.remove('show');renderHistory();showToast('记录已清除')}});
    document.querySelector('#action').addEventListener('click',()=>dialog.showModal());
    document.querySelector('#breath-close').addEventListener('click',()=>{clearInterval(breathInterval);dialog.close()});
    document.querySelector('#breath-start').addEventListener('click',startBreathing);
    function startBreathing(){
      clearInterval(breathInterval);let left=60;let inhale=true;const orb=document.querySelector('#orb');const timer=document.querySelector('#timer');
      document.querySelector('#breath-start').textContent='重新开始';orb.textContent='吸气';orb.classList.add('expand');
      breathInterval=setInterval(()=>{left--;timer.textContent=`00:${String(left).padStart(2,'0')}`;if(left%5===0){inhale=!inhale;orb.textContent=inhale?'吸气':'慢慢呼气';orb.classList.toggle('expand',inhale)}if(left<=0){clearInterval(breathInterval);orb.textContent='做得很好';orb.classList.remove('expand');showToast('你完成了一分钟呼吸')}},1000);
    }
    dialog.addEventListener('cancel',()=>clearInterval(breathInterval));
    renderHistory();

    function registerWebMCP(){
      const context=document.modelContext;if(!context?.registerTool)return;
      try{void Promise.resolve(context.registerTool({name:'create_emotion_entry',title:'记录当前情绪',description:'保存一条情绪、强度、触发因素和可选备注，并在页面展示建议。',inputSchema:{type:'object',properties:{mood:{type:'string',enum:Object.keys(moodFaces)},intensity:{type:'integer',minimum:1,maximum:10},triggers:{type:'array',items:{type:'string'},maxItems:8},note:{type:'string',maxLength:200}},required:['mood','intensity'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute(input){const record=createRecord(input);return{id:record.id,mood:record.mood,intensity:record.intensity,saved:true}}})).catch(()=>{});}catch{}
    }
    registerWebMCP();
  </script>
</body>
</html>
